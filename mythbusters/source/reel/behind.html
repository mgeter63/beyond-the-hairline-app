<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box} html,body{background:transparent;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif}
#root{position:relative;width:1080px;height:1920px}
.big{position:absolute;left:0;right:0;top:640px;text-align:center;font-weight:900;font-size:300px;letter-spacing:-10px;line-height:1;color:#F2C230;opacity:0}
</style></head><body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-duration="12" data-fps="30">
<div class="big" id="w">EARLY</div>
<script src="gsap.min.js"></script><script>
const tl=gsap.timeline({paused:true});
tl.fromTo("#w",{opacity:0,scale:1.25,y:40},{opacity:1,scale:1,y:0,duration:.5,ease:"power3.out"},2.4);
tl.to("#w",{scale:1.06,duration:5,ease:"none"},2.9);
tl.to("#w",{opacity:0,duration:.4},7.7);
window.__timelines={root:tl};
</script></div></body></html>
