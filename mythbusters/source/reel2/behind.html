<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box} html,body{background:transparent;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif}
#root{position:relative;width:1080px;height:1920px}
.big{position:absolute;left:0;right:0;top:470px;text-align:center;font-weight:900;font-size:265px;letter-spacing:-10px;line-height:1;color:#F2C230;opacity:0;text-shadow:0 10px 40px rgba(0,0,0,.25)}
</style></head><body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-duration="15.5" data-fps="30">
<div class="big" id="w">BELOW</div>
<script src="gsap.min.js"></script><script>
const tl=gsap.timeline({paused:true});
tl.fromTo("#w",{opacity:0,y:-260},{opacity:1,y:0,duration:.55,ease:"bounce.out"},9.05);
tl.to("#w",{scale:1.05,duration:3,ease:"none"},9.6);
tl.to("#w",{opacity:0,duration:.3},12.3);
window.__timelines={root:tl};
</script></div></body></html>
